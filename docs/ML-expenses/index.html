<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple CSV Table (11 rows, 3 cols)</title>

  <!-- Barlow -->
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- PapaParse (CSV loader) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <!-- Pym -->
  <script src="https://pym.nprapps.org/pym.v1.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Barlow", sans-serif;
      background: #ffffff;
    }

    .table-container {
      max-width: 550px;
      margin: 0 auto;
      padding: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #ddd;
    }

    th, td {
      padding: 8px;
      text-align: center;
      font-size: 14px;
    }

    th {
      font-weight: 600;
      border-bottom: 1px solid #ddd;
    }

    tbody tr {
      border-bottom: 1px solid #eee;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    @media (max-width: 480px) {
      th, td {
        padding: 6px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div class="table-container" id="content">

    <table id="resultsTable" aria-label="Results table">
      <thead>
        <tr id="headerRow"></tr>
      </thead>
      <tbody id="bodyRows"></tbody>
    </table>

  </div>

  <script>
    // ----------------------------
    // PYM SETUP
    // ----------------------------
    var pymChild = new pym.Child();

    function sendHeight() {
      if (pymChild) {
        pymChild.sendHeight();
      }
    }

    // ----------------------------
    // CONFIG
    // ----------------------------
    const CSV_URL = "expenses_for_chart.csv";
    const MAX_ROWS = 11;
    const MAX_COLS = 3;

    const headerRowEl = document.getElementById("headerRow");
    const bodyRowsEl = document.getElementById("bodyRows");

    function escapeHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        const rows = results?.data ?? [];
        const fields = results?.meta?.fields ?? [];
        const cols = fields.slice(0, MAX_COLS);

        // Header
        headerRowEl.innerHTML = cols
          .map(c => `<th>${escapeHtml(c)}</th>`)
          .join("");

        // Body (first 11 rows)
        bodyRowsEl.innerHTML = rows
          .slice(0, MAX_ROWS)
          .map(r => {
            const tds = cols
              .map(c => `<td>${escapeHtml(r[c])}</td>`)
              .join("");
            return `<tr>${tds}</tr>`;
          })
          .join("");

        // Send height AFTER DOM paints
        requestAnimationFrame(() => {
          sendHeight();
        });
      },
      error: (err) => {
        console.error(err);
        sendHeight();
      }
    });

    // Resize safety
    window.addEventListener("resize", () => {
      sendHeight();
    });
  </script>
</body>
</html>
